<!DOCTYPE html>
<html>
<head>
    <title>Simple Contact Form</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f4f4f4;">

    <form style="width:300px; margin:50px auto; padding:60px; border:1px solid #ccc; background:white; border-radius:5px;">

        <h2 style="text-align:center; margin-bottom:20px;">Contact Form</h2>

        <label>Name:</label><br>
        <input type="text" placeholder="Enter your name" required
               style="width:100%; padding:8px; margin:5px 0 15px 0;"><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter your email" required
               style="width:100%; padding:8px; margin:5px 0 15px 0;"><br>

        <label>Password:</label><br>
        <input type="password" placeholder="Enter password" required minlength="6"
               style="width:100%; padding:8px; margin:5px 0 15px 0;"><br>

        <label>Message:</label><br>
        <textarea placeholder="Write your message" required
                  style="width:100%; padding:8px; margin:5px 0 15px 0; height:80px;"></textarea><br>

        <input type="submit" value="Submit"
               style="width:100%; padding:10px; margin-top:10px; background:#007BFF; color:white; border:none; cursor:pointer;">

    </form>

</body>
</html>
