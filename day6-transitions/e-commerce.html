<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Shop</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Navigation -->
    <header>
        <div class="logo">SimpleShop</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Discover Amazing Products</h1>
        <p>Quality products at affordable prices.</p>
        <button>Shop Now</button>
    </section>

    <!-- Products -->
    <section class="products">

        <div class="card">
            <img src="https://cdn.thewirecutter.com/wp-content/media/2024/09/wireless-tv-headphones-2048px-4212.jpg?auto=webp&quality=75&width=1024&dpr=1.5" alt="Wireless Headphones">
            <h3>Wireless Headphones</h3>
            <p>$59.99</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://microless.com/cdn/products/67120a79b1c1dba8f3120b6101995fb7-hi.jpg" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p>$99.99</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://static.vecteezy.com/system/resources/previews/056/699/893/non_2x/a-pair-of-running-shoes-on-a-beautiful-vibrant-background-free-photo.jpg" alt="Running Shoes">
            <h3>Running Shoes</h3>
            <p>$79.99</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://www.publicdomainpictures.net/pictures/570000/velka/school-backpack-1705681286BaB.jpg" alt="Backpack">
            <h3>Backpack</h3>
            <p>$39.99</p>
            <button>Add to Cart</button>
        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 SimpleShop. All Rights Reserved.</p>
    </footer>

</body>
</html>
